\* A rotation whose cursor is never written, against ADR-0041 decision 2: the
\* walk starts from the same Tenant every time, so Tenant 1 is served while it
\* has a due head and m3 of Tenant 2 waits behind both its rows.  TLC must
\* find BoundedOvertaking violated.
SPECIFICATION MCSpec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  w1 = w1
  w2 = w2
  None = None
  Unreadable <- MCNoUnreadable
  Permanent <- MCNoPermanent
  Msgs <- MCMsgs
  Arrives <- MCArrivesAll
  TenantOf <- MCTwoTenants
  AtomicWait = TRUE
  WaitsOnDependencies = TRUE
  WaitExpires = FALSE
  Rotates <- MCTrue
  Turned <- MCCursorStays
  Deps <- MCNoDeps
  Slots <- MCOneSlot
  MaxCrashes = 0
  Poison <- MCNoPoison
  MaxAttempts = 0
  BlockOnBackoff = TRUE
  MaxAdmin = 0
INVARIANTS
  BoundedOvertaking
