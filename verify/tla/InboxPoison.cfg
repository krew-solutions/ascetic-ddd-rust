\* m1's subscriber never succeeds; after two attempts m1 is parked and the
\* rest of the partition flows.  An operator may unpark or resolve it once.
\* Everything must hold, the order of arrival included.
SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  w1 = w1
  w2 = w2
  None = None
  Msgs <- MCMsgs
  Deps <- MCNoDeps
  Arrives <- MCArrivesAll
  Slots <- MCOneSlot
  MaxCrashes = 1
  Poison <- MCPoisonM1
  MaxAttempts = 2
  BlockOnBackoff = TRUE
  AtomicWait = TRUE
  MaxAdmin = 1
  WaitsOnDependencies = TRUE
  WaitExpires = FALSE
INVARIANTS
  TypeOK
  EffectsOnce
  EffectsIffProcessed
  CausalOrder
  HeldOnce
  ProcessedWasReceived
  WaitingIsAside
  ParkedIsAside
  ArrivalOrder
PROPERTIES
  EventuallyProcessed
  EventuallyParked
