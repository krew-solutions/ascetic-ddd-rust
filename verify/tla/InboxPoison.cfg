\* m1's subscriber never succeeds; after two attempts m1 is parked and the
\* rest of the partition flows.  An operator may unpark or resolve it once.
\* Everything must hold, the order of arrival included.
SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  w1 = w1
  w2 = w2
  None = None
  Msgs <- MCMsgs
  Deps <- MCNoDeps
  Arrives <- MCArrivesAll
  Workers <- MCOneWorker
  Dispatchers <- MCOneDispatcher
  MaxCrashes = 1
  Poison <- MCPoisonM1
  MaxAttempts = 2
  BlockOnBackoff = TRUE
  MaxAdmin = 1
  SkipIneligible = TRUE
INVARIANTS
  TypeOK
  EffectsOnce
  EffectsIffProcessed
  CausalOrder
  HeldOnce
  ProcessedWasReceived
  ParkedIsAside
  ArrivalOrder
PROPERTIES
  EventuallyProcessed
  EventuallyParked
