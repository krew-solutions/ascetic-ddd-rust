\* InboxPgRotation.cfg without max_dormancy: a dormant slot wakes only by
\* the backoffs its round saw, or a row after dormant_after.  Every message
\* is still processed: the cap bounds a wait in time, which this model does
\* not have, and is no matter of liveness.
SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  a1 = a1
  a2 = a2
  b1 = b1
  b2 = b2
  x = x
  y = y
  w1 = w1
  w2 = w2
  d1 = d1
  d2 = d2
  None = None
  Msgs <- MCMsgs
  Arrives <- MCMsgs
  WithLock = TRUE
  HeadInTake = FALSE
  WalkOn = FALSE
  Expires = FALSE
  ForgetsOnExpiry = FALSE
  Rotates <- MCTrue
  Rotates <- [Inbox] MCTrue
  TenantOf <- MCThreeTenants
  TenantOf <- [Inbox] MCThreeTenants
  Slots <- MCOneSlot
  Placements <- MCOnePlacement
  Dispatchers <- MCOneDispatcher
  Deps <- MCNoDeps
  MaxCrashes = 2
  Fails <- MCTrue
  SplitReceive <- MCTrue
  Cap <- MCNoCap
PROPERTIES
  EventuallyProcessed
