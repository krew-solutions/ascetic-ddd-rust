\* dormant_after read by the walk that ends the round, as ADR-0041 first
\* had it.  A row of a Tenant the round has passed, committed during the
\* round, lies below it, and the slot sleeps past it.  TLC must find
\* NoDueHeadAsleep violated.
SPECIFICATION MCSpec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  a1 = a1
  a2 = a2
  b1 = b1
  b2 = b2
  x = x
  y = y
  w1 = w1
  w2 = w2
  d1 = d1
  d2 = d2
  None = None
  Msgs <- MCMsgs
  Arrives <- MCMsgs
  WithLock = TRUE
  HeadInTake = FALSE
  WalkOn = FALSE
  Expires = FALSE
  ForgetsOnExpiry = FALSE
  Rotates <- MCTrue
  Rotates <- [Inbox] MCTrue
  TenantOf <- MCThreeTenants
  TenantOf <- [Inbox] MCThreeTenants
  Slots <- MCOneSlot
  Placements <- MCOnePlacement
  Dispatchers <- MCOneDispatcher
  Deps <- MCNoDeps
  MaxCrashes = 2
  Fails <- MCTrue
  SplitReceive <- MCTrue
  DormantAfterAtWalk <- MCTrue
INVARIANTS
  NoDueHeadAsleep
