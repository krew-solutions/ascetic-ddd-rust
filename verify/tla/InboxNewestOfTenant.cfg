\* A rotation that takes a Tenant's newest row instead of its oldest.  TLC
\* must find ArrivalOrder violated: m2 of Tenant 1 processed before m1.
SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  w1 = w1
  w2 = w2
  None = None
  Unreadable <- MCNoUnreadable
  Permanent <- MCNoPermanent
  Msgs <- MCMsgs
  Arrives <- MCArrivesAll
  TenantOf <- MCTwoTenants
  AtomicWait = TRUE
  WaitsOnDependencies = TRUE
  WaitExpires = FALSE
  Rotates <- MCTrue
  HeadOf <- MCNewestOfTenant
  Deps <- MCNoDeps
  Slots <- MCOneSlot
  MaxCrashes = 0
  Poison <- MCNoPoison
  MaxAttempts = 0
  BlockOnBackoff = TRUE
  MaxAdmin = 0
INVARIANTS
  ArrivalOrder
