  m1 = m1
  m2 = m2
  m3 = m3
  w1 = w1
  w2 = w2
  t1 = t1
  t2 = t2
  None = None
  Msgs <- MCMsgs
  Order <- MCOrder
  Slots <- MCSlots
  Tenants <- MCTenants
  TenantOf <- MCTenantOf
  KeyOf <- MCKeyOf
  MaxAttempts = 2
  Budget = 2
  Tries = 1
  Outages = 0
  OutageEnds = TRUE
  TenantFaults <- MCTenantT1
  TenantEnds = FALSE
  Permanent <- MCNoPermanent
  MaxAdmin = 0
INVARIANTS
  TypeOK
  CauseIsCurrent
  HeldIsQueued
  ParkedIsAside
PROPERTIES
  HoldSpendsNothing
  EventuallyOutOfTheWay
