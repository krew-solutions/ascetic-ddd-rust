\* ADR-0040 with Tenant t1 failing for good and read as the stage's on a
\* channel where nothing else is served meanwhile: nothing refutes the
\* hold, and it holds for good -- the case the stage's sentinel probe and
\* park_held answer.  TLC must find a row never out of the way.
SPECIFICATION Spec
