\* A walk taking its Tenant's newest row: m1 and m2 of one Tenant in one
\* slot.  TLC must find ArrivalOrder violated.
SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  a1 = a1
  a2 = a2
  b1 = b1
  b2 = b2
  x = x
  y = y
  w1 = w1
  w2 = w2
  d1 = d1
  d2 = d2
  None = None
  Msgs <- MCMsgs
  Arrives <- MCMsgs
  WithLock = TRUE
  HeadInTake = FALSE
  WalkOn = FALSE
  Expires = FALSE
  ForgetsOnExpiry = FALSE
  Rotates <- MCTrue
  Rotates <- [Inbox] MCTrue
  TenantOf <- MCTwoTenants
  TenantOf <- [Inbox] MCTwoTenants
  Slots <- MCOneSlot
  Placements <- MCOnePlacement
  Dispatchers <- MCOneDispatcher
  Deps <- MCNoDeps
  MaxCrashes = 0
  HeadIn <- MCNewestIn
INVARIANTS
  ArrivalOrder
