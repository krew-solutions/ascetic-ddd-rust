\* ADR-0041, statement by statement: one slot, one loop, three Tenants of a
\* row each, a walk of one Tenant, two failures and their backoffs, inserts
\* that commit out of the order of their positions.  Everything must hold,
\* and every step must be a step of the rotating Inbox.tla.
SPECIFICATION MCSpec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  a1 = a1
  a2 = a2
  b1 = b1
  b2 = b2
  x = x
  y = y
  w1 = w1
  w2 = w2
  d1 = d1
  d2 = d2
  None = None
  Msgs <- MCMsgs
  Arrives <- MCMsgs
  WithLock = TRUE
  HeadInTake = FALSE
  WalkOn = FALSE
  Expires = FALSE
  ForgetsOnExpiry = FALSE
  Rotates <- MCTrue
  Rotates <- [Inbox] MCTrue
  TenantOf <- MCThreeTenants
  TenantOf <- [Inbox] MCThreeTenants
  Slots <- MCOneSlot
  Placements <- MCOnePlacement
  Dispatchers <- MCOneDispatcher
  Deps <- MCNoDeps
  MaxCrashes = 2
  Fails <- MCTrue
  SplitReceive <- MCTrue
INVARIANTS
  TypeOK
  NoDispatcherDied
  EffectsOnce
  HeldOnce
  ArrivalOrder
  NoDueHeadAsleep
  PassedPerRound
PROPERTIES
  Refines
  EventuallyProcessed
