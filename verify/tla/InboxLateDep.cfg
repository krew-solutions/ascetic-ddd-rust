\* Waits run out, and the dependency of m2 arrives all the same, perhaps
\* after m2's wait ran out: m2 is woken from its parking by the mark of m1
\* (ADR-0036 R8), and every property holds.
SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  w1 = w1
  w2 = w2
  None = None
  Unreadable <- MCNoUnreadable
  Msgs <- MCMsgs
  Deps <- MCDeps
  Arrives <- MCArrivesAll
  Slots <- MCSlots
  MaxCrashes = 1
  Poison <- MCNoPoison
  MaxAttempts = 2
  BlockOnBackoff = TRUE
  AtomicWait = TRUE
  MaxAdmin = 0
  WaitsOnDependencies = TRUE
  WaitExpires = TRUE
INVARIANTS
  TypeOK
  EffectsOnce
  EffectsIffProcessed
  CausalOrder
  HeldOnce
  ProcessedWasReceived
  ParkedIsAside
  WaitingIsAside
PROPERTIES
  EventuallyProcessed
  EventuallyAside
  WokenAfterExpiry
