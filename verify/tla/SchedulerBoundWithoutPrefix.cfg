\* The bound with no prefix: a member its key's earlier member still holds is not counted.
SPECIFICATION Spec
CONSTANTS
  N <- BndN
  At <- BndAt
  Think <- BndThink
  After <- BndAfter
  Key <- BndKey
  Producer <- BndProducer
  Captures <- BndCaptures
  Timeout <- BndTimeout
  Safety <- BndSafety
  Retained <- BndRetained
  W = 1
  L = 1
  Lag = 0
  Times <- BndTimes
  Judgements <- BndJudgements
  MaxAttempts = 1
  Mutant = "BoundWithoutPrefix"
INVARIANTS
  TypeOK
  ReleaseSafe
  BarrierSafe
  NoUseAfterFree
  BoundAsChecked
  NoCensored
  EveryReadLineEnds
  ConditionalExact
  EndsWithinBound
  HeldWithinBound
  PendingWithinBound
