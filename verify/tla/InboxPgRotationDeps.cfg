\* ADR-0041, statement by statement, beside a dependency: m2 depending on
\* m1, in the two cuts of MCRotationPlacements, two loops; m1 and m2 of one
\* Tenant, m3 of another; one failure and its backoff.  Everything must
\* hold, and every step must be a step of the rotating Inbox.tla.
SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  a1 = a1
  a2 = a2
  b1 = b1
  b2 = b2
  x = x
  y = y
  w1 = w1
  w2 = w2
  d1 = d1
  d2 = d2
  None = None
  Msgs <- MCMsgs
  Arrives <- MCMsgs
  WithLock = TRUE
  HeadInTake = FALSE
  WalkOn = FALSE
  Expires = FALSE
  ForgetsOnExpiry = FALSE
  Rotates <- MCTrue
  Rotates <- [Inbox] MCTrue
  TenantOf <- MCTwoTenants
  TenantOf <- [Inbox] MCTwoTenants
  Slots <- MCSlots
  Placements <- MCRotationPlacements
  Dispatchers <- MCDispatchers
  Deps <- MCDeps
  MaxCrashes = 1
  Fails <- MCTrue
INVARIANTS
  TypeOK
  NoDispatcherDied
  NoDeadlock
  EffectsOnce
  CausalOrder
  HeldOnce
  WaitingIsAside
  ArrivalOrder
  NoDueHeadAsleep
PROPERTIES
  Refines
  EventuallyProcessed
