\* Forgetting by the window, which covers the horizon of repeats and keeps
\* dependency targets.  Everything must hold.
SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  w1 = w1
  w2 = w2
  None = None
  Msgs <- MCMsgs
  Deps <- MCDeps
  Arrives <- MCMsgs
  Repeats <- MCMsgs
  Slots <- MCSlots
  MaxCrashes = 1
  Poison <- MCNoPoison
  MaxAttempts = 0
  BlockOnBackoff = TRUE
  AtomicWait = TRUE
  MaxAdmin = 0
  WaitsOnDependencies = TRUE
  WaitExpires = FALSE
  ForgetRule = "window"
INVARIANTS
  TypeOK
  EffectsOnce
  HeldOnce
  ProcessedWasReceived
  EffectsIffEverProcessed
  CausalOrderEver
  WaitingIsAsideEver
