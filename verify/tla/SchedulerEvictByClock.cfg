\* The window evicted by the clock: a late reader binds nothing.
SPECIFICATION Spec
CONSTANTS
  N <- WinN
  At <- WinAt
  Think <- WinThink
  After <- WinAfter
  Key <- WinKey
  Producer <- WinProducer
  Captures <- WinCaptures
  Timeout <- WinTimeout
  Safety <- WinSafety
  Retained <- WinRetained
  W = 1
  L = 2
  Lag = 1
  Times <- WinTimes
  Judgements <- WinJudgements
  MaxAttempts = 2
  Floor = 1
  Jitter = 0
  Waits = {0}
  Mutant = "EvictByClock"
INVARIANTS
  TypeOK
  ResendInTime
  ReleaseSafe
  BarrierSafe
  NoUseAfterFree
  BoundAsChecked
  NoCensored
  EveryReadLineEnds
  ConditionalExact
