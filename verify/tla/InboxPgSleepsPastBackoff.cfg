\* InboxPgRotationNoCap.cfg with a dormancy that the backoffs its round saw
\* do not end, as a dormant_until set to the cap would be.  With no cap,
\* TLC must find EventuallyProcessed violated: a backoff the round saw
\* passes, and the slot sleeps on past its head.
SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  a1 = a1
  a2 = a2
  b1 = b1
  b2 = b2
  x = x
  y = y
  w1 = w1
  w2 = w2
  d1 = d1
  d2 = d2
  None = None
  Msgs <- MCMsgs
  Arrives <- MCMsgs
  WithLock = TRUE
  HeadInTake = FALSE
  WalkOn = FALSE
  Expires = FALSE
  ForgetsOnExpiry = FALSE
  Rotates <- MCTrue
  Rotates <- [Inbox] MCTrue
  TenantOf <- MCThreeTenants
  TenantOf <- [Inbox] MCThreeTenants
  Slots <- MCOneSlot
  Placements <- MCOnePlacement
  Dispatchers <- MCOneDispatcher
  Deps <- MCNoDeps
  MaxCrashes = 2
  Fails <- MCTrue
  SplitReceive <- MCTrue
  Cap <- MCNoCap
  Asleep <- MCSleepsPastBackoff
PROPERTIES
  EventuallyProcessed
