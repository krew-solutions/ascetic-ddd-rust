\* InboxRotationThree.cfg with a walk that goes by Tenant number from the
\* lowest and skips only the cursor's Tenant (MCWalkFromLowest).  TLC must
\* find BoundedOvertaking violated: Tenant 1 comes first from every cursor
\* but its own, so m1, taken again after its dispatcher died and a walk
\* passed Tenant 2, overtakes m4 of Tenant 3 twice.
SPECIFICATION MCSpec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  m4 = m4
  w1 = w1
  w2 = w2
  None = None
  Unreadable <- MCNoUnreadable
  Permanent <- MCNoPermanent
  Msgs <- MCFourMsgs
  Arrives <- MCFourMsgs
  TenantOf <- MCThreeTenants
  AtomicWait = TRUE
  WaitsOnDependencies = TRUE
  WaitExpires = FALSE
  Rotates <- MCTrue
  Dist <- MCWalkFromLowest
  Deps <- MCFourDeps
  Slots <- MCOneSlot
  MaxCrashes = 1
  Poison <- MCNoPoison
  MaxAttempts = 0
  BlockOnBackoff = TRUE
  MaxAdmin = 0
INVARIANT
  BoundedOvertaking
