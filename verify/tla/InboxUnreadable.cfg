\* m1 cannot be read for its own values, which the intake did not foresee
\* or did not write: the
\* dispatcher parks it at once, its subscriber not run, and the rest of the
\* partition flows (ADR-0037 decision 6).  Once, an operator unparks or
\* resolves it, or its producer's repair supersedes it; unparked, it is
\* parked at once again, superseded, it is processed.  Everything must hold,
\* the order of arrival of the others included.
SPECIFICATION Spec
