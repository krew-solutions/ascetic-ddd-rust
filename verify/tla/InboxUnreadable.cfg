\* m1 was stored before the intake's checks and cannot be read: the
\* dispatcher parks it at once, its subscriber not run, and the rest of the
\* partition flows (ADR-0037 decision 6).  An operator may unpark or resolve
\* it once; unparked, it is parked at once again.  Everything must hold, the
\* order of arrival included.
SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  w1 = w1
  w2 = w2
  None = None
  Unreadable <- MCUnreadableM1
  Msgs <- MCMsgs
  Deps <- MCNoDeps
  Arrives <- MCArrivesAll
  Slots <- MCOneSlot
  MaxCrashes = 1
  Poison <- MCNoPoison
  MaxAttempts = 2
  BlockOnBackoff = TRUE
  AtomicWait = TRUE
  MaxAdmin = 1
  WaitsOnDependencies = TRUE
  WaitExpires = FALSE
INVARIANTS
  TypeOK
  EffectsOnce
  EffectsIffProcessed
  CausalOrder
  HeldOnce
  ProcessedWasReceived
  WaitingIsAside
  ParkedIsAside
  ArrivalOrder
PROPERTIES
  EventuallyProcessed
