\* ADR-0041 decision 3: a poison message never parked holds its own (slot,
\* Tenant) and nothing else.  One slot, m1 of Tenant 1 poison and retried
\* for ever; m2 of Tenant 1 waits behind it, by design; m3 of Tenant 2 must
\* be processed.  Rotating, this must hold.
SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  w1 = w1
  w2 = w2
  None = None
  Unreadable <- MCNoUnreadable
  Permanent <- MCNoPermanent
  Msgs <- MCMsgs
  Arrives <- MCArrivesAll
  TenantOf <- MCTwoTenants
  AtomicWait = TRUE
  WaitsOnDependencies = TRUE
  WaitExpires = FALSE
  Rotates <- MCTrue
  Deps <- MCNoDeps
  Slots <- MCOneSlot
  MaxCrashes = 0
  Poison <- MCPoisonM1
  MaxAttempts = 0
  BlockOnBackoff = TRUE
  MaxAdmin = 0
INVARIANTS
  ArrivalOrder
PROPERTIES
  EventuallyProcessedBesidePoison
