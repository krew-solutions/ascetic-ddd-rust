\* The assignment of URIs to slots changes under the positions: what a
\* deployment did when it changed the number of workers with `hash % n` at
\* start-up.  TLC must find NoPassedOver violated: a URI moves to a slot
\* whose position is already past its message.
SPECIFICATION Spec
CONSTANTS
  Msgs = {m1, m2}
  Uris = {u1, u2}
  Groups = {g1}
  Slots = {w1, w2}
  BatchSize = 2
  MaxCrashes = 0
  RehashAllowed = TRUE
  VisibilityRule = TRUE
INVARIANTS
  NoPassedOver
