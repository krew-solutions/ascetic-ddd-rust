\* ADR-0041 with failures: the instance of InboxPoison.cfg -- one slot, m1
\* poison, parked after two attempts, an operator acting once -- with m1 and
\* m2 of Tenant 1 and m3 of Tenant 2, rotating.  Everything must hold.
SPECIFICATION MCSpec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  w1 = w1
  w2 = w2
  None = None
  Unreadable <- MCNoUnreadable
  Permanent <- MCNoPermanent
  Msgs <- MCMsgs
  Arrives <- MCArrivesAll
  TenantOf <- MCTwoTenants
  AtomicWait = TRUE
  WaitsOnDependencies = TRUE
  WaitExpires = FALSE
  Rotates <- MCTrue
  Deps <- MCNoDeps
  Slots <- MCOneSlot
  MaxCrashes = 1
  Poison <- MCPoisonM1
  MaxAttempts = 2
  BlockOnBackoff = TRUE
  MaxAdmin = 1
INVARIANTS
  TypeOK
  EffectsOnce
  EffectsIffProcessed
  CausalOrder
  HeldOnce
  ProcessedWasReceived
  WaitingIsAside
  ParkedIsAside
  ArrivalOrder
  BoundedOvertaking
PROPERTIES
  EventuallyProcessed
  EventuallyParked
