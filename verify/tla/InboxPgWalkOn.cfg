\* A dispatcher that set a head aside walks on in the same transaction,
\* holding the lock: the first design of ADR-0009.  TLC must find two
\* dispatchers waiting for each other's lock.
SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  a1 = a1
  a2 = a2
  b1 = b1
  b2 = b2
  x = x
  y = y
  w1 = w1
  w2 = w2
  d1 = d1
  d2 = d2
  None = None
  Slots <- MCSlots
  Dispatchers <- MCDispatchers
  Msgs <- MCCycleMsgs
  Deps <- MCCycleDeps
  Arrives <- MCCycleArrives
  Placements <- MCCyclePlacements
  MaxCrashes = 0
  WithLock = TRUE
  HeadInTake = FALSE
  WalkOn = TRUE
INVARIANTS
  TypeOK
  NoDeadlock
