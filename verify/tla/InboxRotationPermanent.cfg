\* ADR-0041 beside ADR-0010's permanent verdict: one slot, m1 and m2 of
\* Tenant 1 and m3 of Tenant 2, rotating, m1's subscriber saying no retry
\* will succeed, a crash allowed, parked after two attempts, an operator
\* acting once. The permanent park takes the cursor nowhere, overtakes no
\* other Tenant, and leaves every other message to be processed.
\* Everything must hold.
SPECIFICATION MCSpec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  w1 = w1
  w2 = w2
  None = None
  Unreadable <- MCNoUnreadable
  Permanent <- MCPermanentM1
  Msgs <- MCMsgs
  Arrives <- MCArrivesAll
  TenantOf <- MCTwoTenants
  AtomicWait = TRUE
  WaitsOnDependencies = TRUE
  WaitExpires = FALSE
  Rotates <- MCTrue
  Deps <- MCNoDeps
  Slots <- MCOneSlot
  MaxCrashes = 1
  Poison <- MCNoPoison
  MaxAttempts = 2
  BlockOnBackoff = TRUE
  MaxAdmin = 1
INVARIANTS
  TypeOK
  EffectsOnce
  EffectsIffProcessed
  CausalOrder
  HeldOnce
  ProcessedWasReceived
  WaitingIsAside
  ParkedIsAside
  ArrivalOrder
  BoundedOvertaking
PROPERTIES
  EventuallyProcessed
