\* A slot as one FIFO across Tenants, before ADR-0041: m3 of Tenant 2 waits
\* behind every older row of Tenant 1.  TLC must find BoundedOvertaking
\* violated: m1 and m2 taken while m3 is a due head.
SPECIFICATION MCSpec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  w1 = w1
  w2 = w2
  None = None
  Unreadable <- MCNoUnreadable
  Permanent <- MCNoPermanent
  Msgs <- MCMsgs
  Arrives <- MCArrivesAll
  TenantOf <- MCTwoTenants
  AtomicWait = TRUE
  WaitsOnDependencies = TRUE
  WaitExpires = FALSE
  Deps <- MCNoDeps
  Slots <- MCOneSlot
  MaxCrashes = 0
  Poison <- MCNoPoison
  MaxAttempts = 0
  BlockOnBackoff = TRUE
  MaxAdmin = 0
INVARIANTS
  BoundedOvertaking
