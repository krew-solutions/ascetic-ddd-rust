\* The dependency of m2 never arrives, and waits run out: m2 is parked with
\* the dependency named, and every received message ends up processed or
\* parked.
SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  w1 = w1
  w2 = w2
  None = None
  Msgs <- MCMsgs
  Deps <- MCDeps
  Arrives <- MCArrivesWithoutM1
  Slots <- MCSlots
  MaxCrashes = 1
  Poison <- MCNoPoison
  MaxAttempts = 2
  BlockOnBackoff = TRUE
  AtomicWait = TRUE
  MaxAdmin = 0
  WaitsOnDependencies = TRUE
  WaitExpires = TRUE
INVARIANTS
  TypeOK
  EffectsOnce
  EffectsIffProcessed
  CausalOrder
  HeldOnce
  ProcessedWasReceived
  ArrivalOrder
  ParkedIsAside
  WaitingIsAside
PROPERTIES
  EventuallyProcessed
  EventuallyAside
