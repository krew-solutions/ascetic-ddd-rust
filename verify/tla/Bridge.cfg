\* Outbox -> bridge -> inbox, with crashes on both sides, one message the
\* intake can never store and one hold of the inbox's database.  Everything
\* must hold.
SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  u1 = u1
  u2 = u2
  w1 = w1
  v1 = v1
  v2 = v2
  None = None
  Unstorable <- MCUnstorable
  MaxHolds = 1
  RejectBeforeAck = TRUE
  AckWithoutSetAside = FALSE
  SetAsideOnHold = FALSE
  Msgs <- MCMsgs
  Uris <- MCUris
  SrcSlots <- MCSrcSlots
  DstSlots <- MCDstSlots
  SrcGroup <- MCGroup
  BatchSize = 2
  MaxCrashes = 1
  StoreBeforeAck = TRUE
INVARIANTS
  TypeOK
  SourceInvariants
  DestinationInvariants
  ReceivedWasCommitted
  EndToEndOrder
  SetAsideOnlyUnstorable
  SetAsideNeverStored
PROPERTIES
  EventuallyProcessed
  EventuallySetAside
