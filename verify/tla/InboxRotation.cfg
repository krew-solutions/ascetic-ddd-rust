\* ADR-0041: the slot serves its Tenants in turn.  The instance of Inbox.cfg
\* -- m2 depending on m1, two slots in every cut, one crash -- with m1 and m2
\* of Tenant 1 and m3 of Tenant 2.  Everything must hold, and while a
\* message is a due head its slot takes at most NT - 1 heads of other Tenants.
SPECIFICATION MCSpec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  w1 = w1
  w2 = w2
  None = None
  Unreadable <- MCNoUnreadable
  Permanent <- MCNoPermanent
  Msgs <- MCMsgs
  Arrives <- MCArrivesAll
  TenantOf <- MCTwoTenants
  AtomicWait = TRUE
  WaitsOnDependencies = TRUE
  WaitExpires = FALSE
  Rotates <- MCTrue
  Deps <- MCDeps
  Slots <- MCSlots
  MaxCrashes = 1
  Poison <- MCNoPoison
  MaxAttempts = 0
  BlockOnBackoff = TRUE
  MaxAdmin = 0
INVARIANTS
  TypeOK
  EffectsOnce
  EffectsIffProcessed
  CausalOrder
  HeldOnce
  ProcessedWasReceived
  ArrivalOrder
  WaitingIsAside
  BoundedOvertaking
PROPERTIES
  EventuallyProcessed
