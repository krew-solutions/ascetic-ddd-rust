\* The same outbox without the visibility rule, fetching by transaction id
\* alone.  TLC must find NoPassedOver violated: a message whose transaction
\* took an earlier id but commits later is passed over.
SPECIFICATION Spec
CONSTANTS
  Msgs = {m1, m2}
  Uris = {u1}
  Groups = {g1}
  Workers = {w1}
  BatchSize = 2
  MaxCrashes = 0
  VisibilityRule = FALSE
INVARIANTS
  NoPassedOver
