\* The statements as implemented: the wait under the lock, the head read
\* after the lock, one set-aside per transaction.  Everything must hold, and
\* every step must be a step of Inbox.tla.
SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  a1 = a1
  a2 = a2
  b1 = b1
  b2 = b2
  x = x
  y = y
  w1 = w1
  w2 = w2
  d1 = d1
  d2 = d2
  None = None
  Slots <- MCSlots
  Dispatchers <- MCDispatchers
  Msgs <- MCMsgs
  Deps <- MCDeps
  Arrives <- MCMsgs
  Placements <- MCPlacements
  MaxCrashes = 1
  WithLock = TRUE
  HeadInTake = FALSE
  WalkOn = FALSE
INVARIANTS
  TypeOK
  NoDispatcherDied
  NoDeadlock
  EffectsOnce
  CausalOrder
  HeldOnce
  WaitingIsAside
  ArrivalOrder
PROPERTIES
  Refines
  EventuallyProcessed
