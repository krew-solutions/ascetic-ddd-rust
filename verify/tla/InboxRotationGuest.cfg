\* ADR-0042 decision 5 over ADR-0041's three Tenants in one slot, with
\* guests beside the slot's walk that skip Tenant 3, as a paused channel's
\* heads: m1 and m2 of Tenant 1, m2 depending on m1, m3 of Tenant 2, m4 of
\* Tenant 3; one crash.  Everything must hold, and a head no guest skips is
\* overtaken at most twice by each other Tenant, once by each cursor.
SPECIFICATION MCSpec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  m4 = m4
  w1 = w1
  w2 = w2
  None = None
  Unreadable <- MCNoUnreadable
  Permanent <- MCNoPermanent
  Msgs <- MCFourMsgs
  Arrives <- MCFourMsgs
  TenantOf <- MCThreeTenants
  AtomicWait = TRUE
  WaitsOnDependencies = TRUE
  WaitExpires = FALSE
  Rotates <- MCTrue
  Guests <- MCTrue
  GuestSkips <- MCSkipThree
  Deps <- MCFourDeps
  Slots <- MCOneSlot
  MaxCrashes = 1
  Poison <- MCNoPoison
  MaxAttempts = 0
  BlockOnBackoff = TRUE
  MaxAdmin = 0
INVARIANTS
  TypeOK
  EffectsOnce
  EffectsIffProcessed
  CausalOrder
  HeldOnce
  ProcessedWasReceived
  ArrivalOrder
  WaitingIsAside
  BoundedOvertaking
PROPERTIES
  EventuallyProcessed
