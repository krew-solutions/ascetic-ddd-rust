\* A failed message waiting for its backoff is stepped over instead of
\* holding its partition.  TLC must find ArrivalOrder violated: m1 fails
\* once, m2 is processed meanwhile, m1 after it.
SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  w1 = w1
  w2 = w2
  None = None
  Msgs <- MCMsgs
  Deps <- MCNoDeps
  Arrives <- MCArrivesAll
  Slots <- MCOneSlot
  MaxCrashes = 1
  Poison <- MCNoPoison
  MaxAttempts = 0
  BlockOnBackoff = FALSE
  AtomicWait = TRUE
  MaxAdmin = 0
  WaitsOnDependencies = TRUE
  WaitExpires = FALSE
INVARIANTS
  ArrivalOrder
