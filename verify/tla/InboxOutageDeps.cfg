\* ADR-0042: m3 waiting for m2, queued behind m1, m4 for x, which never arrives:
\* m3 is spared and processed, m4 expires.
\* Every invariant and property must hold.
SPECIFICATION Spec
CONSTANTS
  m1 = m1
  m2 = m2
  m3 = m3
  m4 = m4
  x = x
  s1 = s1
  s2 = s2
  t1 = t1
  t2 = t2
  p1 = p1
  p2 = p2
  a1 = a1
  a2 = a2
  b1 = b1
  None = None
  Msgs <- MCMsgsDeps
  Order <- MCOrderDeps
  Missing <- MCMissingDeps
  Slots <- MCSlots
  SlotOf <- MCSlotOfDeps
  Tenants <- MCTenants
  TenantOf <- MCTenantOfDeps
  KeyOf <- MCKeyOfDeps
  Dep <- MCDeps
  Procs <- MCProcs
  Workers <- MCWorkers2
  ProcOf <- MCProcOf2
  Outages = 0
  OutageEnds = TRUE
  CutOffs <- MCNone
  CutEnds = TRUE
  Cached <- MCCachedNone
  TenantFaults <- MCNone
  TenantEnds = TRUE
  Permanent <- MCNone
  Flaky <- MCNone
  MaxAttempts = 2
  Tries = 1
  HoldCap = 1
  MaxAdmin = 0
  MaxRollbacks = 0
  Depends = FALSE
  Mutant = "none"
INVARIANTS
  TypeOK
  UnavailableNeverParks
  HoldIsQueued
  CauseIsCurrent
  KeyOrder
  UnaskedHoldIsTheTenants
PROPERTIES
  PresentDependencyNeverExpires
  EventuallyOutOfTheWay
