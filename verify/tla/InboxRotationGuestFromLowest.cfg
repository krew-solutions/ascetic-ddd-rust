\* A refuted design: guests without a cursor of their own, walking from the
\* lowest Tenant each time (ADR-0042 § Executors, P1's "drop the cursor"):
\* Tenant 1 comes first at every guest's walk, and TLC must find a head of
\* Tenant 2 overtaken by it more than twice.
