[package]
name = "ascetic-ddd-specification"
description = "Specification pattern: a predicate as a tree, built by hand, by a typed DSL, from a JSONPath template or from a Rust function; evaluated in memory or compiled to PostgreSQL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["macros"]
# `#[specification]`: a Rust predicate function and its tree from one source.
macros = ["dep:ascetic-ddd-specification-macros"]
# `ToSql` for `Value`, so that compiled parameters go to `tokio-postgres` as they are.
pg = ["dep:bytes", "dep:postgres-types"]

[dependencies]
ascetic-ddd-specification-macros = { path = "../specification-macros", version = "0.1.0", optional = true }
bytes = { version = "1", optional = true }
postgres-types = { version = "0.2.14", optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7.18"
