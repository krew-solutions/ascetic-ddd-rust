[package]
name = "ascetic-ddd-session"
description = "Unit of Work: session scopes, nested transactions and an identity map."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
# PostgreSQL adapter: pulls in the driver and the connection pool.
pg = ["dep:tokio-postgres", "dep:deadpool-postgres"]

[dependencies]
deadpool-postgres = { version = "0.14.2", optional = true }
tokio-postgres = { version = "0.7.18", optional = true }

[dev-dependencies]
futures.workspace = true
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
