[package]
name = "ascetic-ddd-kms"
description = "Key management for a tenant's keys: a key-encryption key per tenant, versioned and rotated, and signatures and MACs under the tenant's keys, kept in PostgreSQL under a master key or in HashiCorp Vault Transit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
# PostgreSQL adapter: key-encryption, signing and MAC keys in tables, each wrapped
# by a master key; the signing and MACs are the model's, in this process.
pg = ["ascetic-ddd-session/pg", "dep:tokio-postgres"]
# HashiCorp Vault Transit adapter, over any HTTP client that implements `VaultTransport`.
vault = ["dep:base64", "dep:futures", "dep:percent-encoding", "dep:serde_json"]
# `VaultTransport` for `reqwest::Client`. TLS is the application's choice: enable a
# `reqwest` TLS feature downstream.
reqwest = ["vault", "dep:reqwest"]

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
ascetic-ddd-session = { path = "../session" }
base64 = { version = "0.22", optional = true }
ed25519-dalek = "3"
futures = { workspace = true, optional = true }
getrandom = "0.4"
hmac = "0.12"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
percent-encoding = { version = "2.3", optional = true }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["json"] }
serde_json = { workspace = true, optional = true }
sha2 = "0.10"
tokio-postgres = { version = "0.7.18", optional = true }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
# `pkcs8`: the test that reads the public key Transit publishes for a P-256 key, a PEM
# SubjectPublicKeyInfo, into the model's `PublicKey`.
p256 = { version = "0.14", default-features = false, features = ["pkcs8"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
