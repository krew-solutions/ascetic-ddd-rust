    { path = "std::thread::sleep", reason = "the shell sleeps on its `Clock` (ADR-0047 decision 16)" },
    { path = "std::thread::park_timeout", reason = "a timed wait is the clock's (ADR-0047 decision 16, K2b-7e-2b-3e)" },
