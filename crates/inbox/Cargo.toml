[package]
name = "ascetic-ddd-inbox"
description = "Transactional Inbox on PostgreSQL: idempotent, causally ordered processing of incoming messages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
ascetic-ddd-bus = { path = "../bus" }
ascetic-ddd-session = { path = "../session", features = ["pg"] }
futures.workspace = true
log = "0.4"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }

[dev-dependencies]
ascetic-ddd-outbox = { path = "../outbox" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
